name: Android emulator instrumentation
on:
  push:
    paths: ["mobile/**", ".github/workflows/android-emulator.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-emulator.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: google_apis
          - api-level: 36
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      # Build before booting the emulator so its startup time does not count against compilation.
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: mobile
      # Real Keystore, Room/SQLCipher and libsignal JNI on x86_64; no stubbed core.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: mobile
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            mkdir -p app/build/outputs/logcat && adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest || (adb logcat -d -v brief AndroidRuntime:E TestRunner:E System.err:W '*:S' > app/build/outputs/logcat/failure.txt; exit 1)
      # Logs and artifacts need blob storage; annotations stay readable through the public checks API.
      - name: Annotate failures
        if: failure()
        working-directory: mobile
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          def note(title, text):
              text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')[:3500]
              print(f"::error title={title}::{text}")
          for path in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      note(f"{case.get('classname','').split('.')[-1]}.{case.get('name')}", (bad.text or bad.get('message') or '')[:3500])
          try:
              lines = [l for l in open('app/build/outputs/logcat/failure.txt', errors='replace') if l.strip()]
              if lines: note('logcat', ''.join(lines[:60]))
          except FileNotFoundError: pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-api${{ matrix.api-level }}
          path: |
            mobile/app/build/outputs/androidTest-results/
            mobile/app/build/reports/androidTests/
            mobile/app/build/outputs/logcat/
          retention-days: 14
