name: kniterp-messenger-dev
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: messenger
      POSTGRES_DB: messenger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-dev.py}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U messenger -d messenger"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Database is available only inside the Compose network.
  api:
    build:
      context: .
      dockerfile: server/Messenger.Api/Dockerfile
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Dev__AutoMigrate: "true"
      Dev__DataProtectionPath: /data/protection
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - protection_data:/data/protection
volumes:
  postgres_data:
  protection_data:
